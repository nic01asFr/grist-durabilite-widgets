<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor — Durability</title>

  <link rel="stylesheet" href="assets/shared-styles.css?v=4">
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="assets/grist-helpers.js?v=4"></script>
  <script>
    // An older cached copy of grist-helpers.js would break this page: say so instead of failing silently
    if (typeof GristHelpers === 'undefined' || (GristHelpers.ASSETS_VERSION || 0) < 4) {
      document.addEventListener('DOMContentLoaded', () => document.body.insertAdjacentHTML('afterbegin',
        '<div style="padding:10px 14px;margin-bottom:12px;border:1px solid #dc2626;border-radius:8px;color:#dc2626;background:#fff;font-size:13px">' +
        'An outdated version of the shared scripts is cached by the browser. Reload the page (Ctrl+Shift+R / Cmd+Shift+R).</div>'));
    }
  </script>

  <style>
    body { padding-bottom: 70px; }

    .section-toggle { cursor: pointer; user-select: none; }
    .section-toggle::before { content: '▾ '; }
    .section-toggle.collapsed::before { content: '▸ '; }
    .section-body.collapsed { display: none; }

    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; margin-bottom: 4px; }
    .field-grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
    .field-item label { display: block; font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 3px; }
    .field-item input, .field-item select, .field-item textarea {
      width: 100%; padding: 6px 8px; background: var(--bg);
      border: 1px solid var(--surface2); border-radius: 6px;
      color: var(--text); font-size: 12px; box-sizing: border-box;
    }
    .field-item input:focus, .field-item select:focus, .field-item textarea:focus {
      outline: none; border-color: var(--accent);
    }
    .field-item input.changed, .field-item select.changed, .field-item textarea.changed {
      border-color: #f59e0b; background: rgba(245,158,11,0.07);
    }
    .field-item textarea { min-height: 60px; resize: vertical; }

    .binder-row {
      display: grid; grid-template-columns: 1fr auto 100px 32px;
      gap: 8px; align-items: center; margin-bottom: 5px; font-size: 12px;
    }
    .binder-row .b-name { color: var(--text-muted); font-weight: 500; }
    .binder-row .b-type { color: var(--text-dim); font-size: 11px; }
    .binder-row input[type=number] {
      padding: 5px 8px; background: var(--bg); border: 1px solid var(--surface2);
      border-radius: 6px; color: var(--text); font-size: 12px;
    }
    .binder-row input[type=number]:focus { outline: none; border-color: var(--accent); }
    .btn-del {
      padding: 3px 8px; font-size: 11px; color: #ef4444;
      background: transparent; border: 1px solid #ef4444;
      border-radius: 5px; cursor: pointer;
    }
    .btn-del:hover { background: rgba(239,68,68,0.08); }
    .shared-note:empty { display: none; }
    .shared-note {
      font-size: 11px; color: var(--warning); background: var(--bg); border: 1px solid var(--warning);
      border-left-width: 3px; border-radius: 6px; padding: 6px 10px; margin-bottom: 10px;
    }
    .placement-block { border: 1px solid var(--surface2); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
    .placement-block .pl-head { font-size: 12px; font-weight: 600; margin-bottom: 8px; }
    .placement-block details { margin-top: 8px; }
    .placement-block summary { font-size: 11px; color: var(--text-muted); cursor: pointer; }
    .code-row, .add-code-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
    .code-row input, .add-code-row input { flex: 1 1 140px; min-width: 0; }
    .code-row select { flex: 1 1 160px; min-width: 0; }
    .meas-sub { display: block; font-size: 10px; color: var(--text-dim); margin-top: 2px; }
    .btn-add-inline {
      padding: 5px 12px; font-size: 11px; cursor: pointer;
      background: rgba(59,130,246,0.1); color: var(--accent);
      border: 1px solid var(--accent); border-radius: 5px; margin-top: 6px;
    }
    .btn-add-inline:hover { background: rgba(59,130,246,0.18); }
    .add-binder-row {
      display: grid; grid-template-columns: 1fr 100px auto;
      gap: 8px; align-items: center; margin-top: 8px; padding-top: 8px;
      border-top: 1px dashed var(--surface2);
    }
    .add-binder-row select, .add-binder-row input {
      padding: 5px 8px; background: var(--bg); border: 1px solid var(--surface2);
      border-radius: 6px; color: var(--text); font-size: 12px;
    }
    .add-binder-row select:focus, .add-binder-row input:focus {
      outline: none; border-color: var(--accent);
    }

    .save-bar {
      position: sticky; bottom: 0; z-index: 10;
      background: var(--bg); border-top: 2px solid var(--accent);
      padding: 10px 14px; display: flex; gap: 8px;
      justify-content: flex-end; align-items: center;
    }
    .nb-changes { font-size: 12px; color: var(--text-dim); flex: 1; }

    .meas-row {
      display: flex; gap: 12px; font-size: 12px;
      padding: 5px 0; border-bottom: 1px solid var(--surface2);
      align-items: center; flex-wrap: wrap;
    }
    .meas-row:last-child { border-bottom: none; }
    .meas-badge {
      padding: 2px 8px; border-radius: 10px; font-size: 10px;
      font-weight: 600; background: var(--surface2); color: var(--text-muted);
    }
    .meas-detail { color: var(--text-dim); font-size: 11px; }

    .card { border: 1px solid var(--surface2); }
    .card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 0;
    }
    .card-header .card-title { margin-bottom: 0; }
    .section-body { margin-top: 12px; }

    .no-binders { font-size: 12px; color: var(--text-dim); font-style: italic; padding: 4px 0; }

    /* === MEASUREMENTS TABLE === */
    #meas-search {
      width: 100%; padding: 7px 10px; margin-bottom: 8px;
      background: var(--surface); border: 1px solid var(--surface2);
      border-radius: 8px; color: var(--text); font-size: 13px;
    }
    .meas-tbl-stats { font-size: 11px; color: var(--text-dim); margin-bottom: 6px; }
    .meas-tbl-wrap {
      overflow-x: auto; overflow-y: auto; max-height: 45vh;
      border-radius: 8px; border: 1px solid var(--surface2); margin-bottom: 4px;
    }
    .tag {
      display: inline-block; padding: 2px 7px; border-radius: 10px;
      font-size: 10px; font-weight: 600; background: var(--surface2); color: var(--text-muted);
    }
    .tag.total_cl   { background: #0ea5e920; color: #0ea5e9; }
    .tag.free_cl    { background: #f9731620; color: #f97316; }
    .tag.in-situ    { background: #22c55e20; color: #22c55e; }
    .tag.laboratory { background: #a855f720; color: #a855f7; }
    #meas-data-table { width: 100%; border-collapse: collapse; font-size: 11px; color: var(--text); }
    #meas-data-table thead th {
      position: sticky; top: 0; z-index: 2;
      background: var(--surface); padding: 7px 10px;
      text-align: left; font-size: 10px; font-weight: 700;
      color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.4px;
      border-bottom: 2px solid var(--surface2); white-space: nowrap;
      cursor: pointer; user-select: none;
    }
    #meas-data-table thead th:hover { color: var(--accent); }
    #meas-data-table thead th .sort-arrow { margin-left: 4px; opacity: 0.4; }
    #meas-data-table thead th.sorted-asc  .sort-arrow::after { content: '▲'; opacity: 1; }
    #meas-data-table thead th.sorted-desc .sort-arrow::after { content: '▼'; opacity: 1; }
    #meas-data-table thead th .sort-arrow::after { content: '⇅'; }
    #meas-data-table tbody tr { border-bottom: 1px solid var(--surface2); cursor: pointer; transition: background 0.1s; }
    #meas-data-table tbody tr:hover { background: var(--surface); }
    #meas-data-table tbody tr.meas-selected { background: rgba(59,130,246,0.12); }
    #meas-data-table tbody tr.meas-selected td { color: var(--text); }
    #meas-data-table tbody td { padding: 6px 10px; white-space: nowrap; color: var(--text-muted); }
    .meas-scal-empty { color: var(--text-dim); }
    .meas-scal-unit { font-size: 10px; color: var(--text-dim); margin-left: 2px; }

    /* === SELECTED MEASUREMENT FORM === */
    .sub-section-title {
      font-size: 10px; font-weight: 600; letter-spacing: 0.8px;
      text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px;
    }
    .scalar-cols-header {
      display: grid; grid-template-columns: 1fr 130px 80px 32px;
      gap: 6px; font-size: 10px; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px;
    }
    .scalar-row {
      display: grid; grid-template-columns: 1fr 130px 80px 32px;
      gap: 6px; align-items: center; margin-bottom: 4px;
    }
    .scalar-row input {
      padding: 4px 7px; background: var(--bg);
      border: 1px solid var(--surface2); border-radius: 5px;
      color: var(--text); font-size: 12px;
    }
    .scalar-row input:focus { outline: none; border-color: var(--accent); }
    .scalar-row input.changed { border-color: #f59e0b; background: rgba(245,158,11,0.07); }
    .add-scalar-row {
      display: grid; grid-template-columns: 1fr 130px 80px auto;
      gap: 6px; align-items: center; margin-top: 8px; padding-top: 8px;
      border-top: 1px dashed var(--surface2);
    }
    .add-scalar-row input {
      padding: 5px 7px; background: var(--bg);
      border: 1px solid var(--surface2); border-radius: 5px;
      color: var(--text); font-size: 12px;
    }
    .add-scalar-row input:focus { outline: none; border-color: var(--accent); }
    .curve-row {
      font-size: 11px; color: var(--text-dim); padding: 4px 0;
      border-bottom: 1px solid var(--surface2); display: flex; gap: 12px; align-items: center;
    }
    .curve-row:last-child { border-bottom: none; }

    .meas-group-row td {
      background: var(--surface);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      padding: 5px 10px;
      border-top: 2px solid var(--surface2);
      user-select: none;
      cursor: default;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <h1><span class="icon">✏️</span> Editor</h1>
    <div id="status" class="status">
      <div class="dot"></div>
      <span id="status-text">Initializing…</span>
    </div>
  </div>

  <!-- MEASUREMENTS TABLE (always visible, all measurements) -->
  <div class="card" id="meas-table-panel" style="display:none;">
    <div class="card-title" style="margin-bottom:8px;">MEASUREMENTS</div>
    <input type="text" id="meas-search" placeholder="🔍 Search a measurement…" oninput="renderMeasTable()">
    <div class="meas-tbl-stats" id="meas-tbl-stats">—</div>
    <div class="meas-tbl-wrap">
      <table id="meas-data-table">
        <thead id="meas-thead"><tr></tr></thead>
        <tbody id="meas-tbl-body"></tbody>
      </table>
    </div>
  </div>

  <!-- SELECTED MEASUREMENT FORM -->
  <div class="card" id="meas-detail-panel" style="display:none;">
    <div class="card-title" style="margin-bottom:10px;">
      SELECTED MEASUREMENT
      <span id="meas-detail-subtitle" style="font-weight:400;font-size:11px;color:var(--text-dim);margin-left:8px;"></span>
    </div>

  <!-- EMPTY STATE -->
  <div id="empty-state" class="empty-state">
    <div class="icon">🧱</div>
    <h3>No material selected</h3>
    <p>Click on a measurement in the table to edit its data.</p>
  </div>

  <!-- EDITOR CONTENT -->
  <div id="editor-content" style="display:none;">

      <div id="meas-detail-body"></div>
    </div>

    <!-- SECTION: MATERIAL -->
    <div class="card" id="card-material">
      <div class="card-header">
        <div class="card-title section-toggle" id="toggle-material" onclick="toggleSection('material')">MATERIAL</div>
      </div>
      <div class="section-body" id="body-material">
        <div class="field-grid cols-3">
          <div class="field-item">
            <label>Name</label>
            <input type="text" id="f-mat-name" data-table="MATERIAL" data-field="name">
          </div>
          <div class="field-item">
            <label>Manufacturing date</label>
            <input type="date" id="f-mat-manuf" data-table="MATERIAL" data-field="manufacturing_date" data-date="true">
          </div>
          <div class="field-item">
            <label>Demolding date</label>
            <input type="date" id="f-mat-demold" data-table="MATERIAL" data-field="demolding_date" data-date="true">
          </div>
        </div>
        <div class="sub-section-title" style="margin-top:12px;">Campaign codes</div>
        <div id="mat-codes"></div>
        <div class="add-code-row">
          <input type="text" id="new-code-label" placeholder="New code (e.g. M3)">
          <button class="btn-add-inline" onclick="addCodeRow()">+ Code</button>
        </div>
      </div>
    </div>

    <!-- SECTION: EXPOSURES (PLACEMENT: site + exposure condition + dates, 0..n per material) -->
    <div class="card" id="card-placements">
      <div class="card-header">
        <div class="card-title section-toggle" id="toggle-placements" onclick="toggleSection('placements')">EXPOSURES</div>
      </div>
      <div class="section-body" id="body-placements">
        <div id="placements-list"></div>
      </div>
    </div>

    <!-- SECTION: MIX DESIGN -->
    <div class="card" id="card-mix">
      <div class="card-header">
        <div class="card-title section-toggle collapsed" id="toggle-mix" onclick="toggleSection('mix')">MIX DESIGN</div>
      </div>
      <div class="section-body collapsed" id="body-mix">
        <div class="shared-note" id="shared-mix"></div>
        <div class="field-grid cols-3">
          <div class="field-item">
            <label>Name</label>
            <input type="text" id="f-mix-name" data-table="MIX_DESIGN" data-field="name">
          </div>
          <div class="field-item">
            <label>Material type</label>
            <select id="f-mix-type" data-table="MIX_DESIGN" data-field="material_type"></select>
          </div>
          <div class="field-item"><!-- spacer --></div>
          <div class="field-item">
            <label>w/c ratio</label>
            <input type="number" step="0.01" min="0" id="f-mix-wc" data-table="MIX_DESIGN" data-field="wc_ratio">
          </div>
          <div class="field-item">
            <label>w/b ratio</label>
            <input type="number" step="0.01" min="0" id="f-mix-wl" data-table="MIX_DESIGN" data-field="wl_ratio">
          </div>
          <div class="field-item">
            <label>Water (kg/m³)</label>
            <input type="number" step="any" min="0" id="f-mix-water" data-table="MIX_DESIGN" data-field="water_content_kg">
          </div>
          <div class="field-item">
            <label>Water type</label>
            <select id="f-mix-watertype" data-table="MIX_DESIGN" data-field="water_type">
              <option value="">— choose —</option>
            </select>
          </div>
          <div class="field-item">
            <label>Admixture type</label>
            <input type="text" id="f-mix-admix" list="dl-admix" data-table="MIX_DESIGN" data-field="admix_type">
            <datalist id="dl-admix"></datalist>
          </div>
          <div class="field-item">
            <label>Admixture (kg/m³)</label>
            <input type="number" step="any" min="0" id="f-mix-adjuvant" data-table="MIX_DESIGN" data-field="adjuvant_content">
          </div>
          <div class="field-item">
            <label>Entrained air (%)</label>
            <input type="number" step="any" min="0" id="f-mix-air" data-table="MIX_DESIGN" data-field="entrained_air">
          </div>
        </div>
        <div style="margin-top:12px;">
          <div class="sub-section-title">Aggregates</div>
          <div id="aggregates-list"></div>
          <button class="btn-add-inline" onclick="showAddAggregateRow()">+ Add aggregate</button>
          <div class="add-binder-row" id="add-aggregate-row" style="display:none;">
            <select id="new-aggregate-select">
              <option value="">— choose an aggregate —</option>
            </select>
            <input type="number" step="any" min="0" id="new-aggregate-kg" placeholder="kg/m³">
            <button class="btn btn-primary" style="padding:5px 12px;font-size:11px;" onclick="confirmAddAggregate()">Add</button>
          </div>
        </div>
      </div>
    </div>

    <!-- SECTION: BINDERS -->
    <div class="card" id="card-binders">
      <div class="card-header">
        <div class="card-title section-toggle collapsed" id="toggle-binders" onclick="toggleSection('binders')">BINDERS</div>
      </div>
      <div class="section-body collapsed" id="body-binders">
        <div class="shared-note" id="shared-binders"></div>
        <div id="binders-list"></div>
        <button class="btn-add-inline" onclick="showAddBinderRow()">+ Add binder</button>
        <div class="add-binder-row" id="add-binder-row" style="display:none;">
          <select id="new-binder-select">
            <option value="">— choose a binder —</option>
          </select>
          <input type="number" step="any" min="0" id="new-binder-kg" placeholder="kg/m³">
          <button class="btn btn-primary" style="padding:5px 12px;font-size:11px;" onclick="confirmAddBinder()">Add</button>
        </div>
      </div>
    </div>

    <!-- SECTION: CURING -->
    <div class="card" id="card-cure">
      <div class="card-header">
        <div class="card-title section-toggle collapsed" id="toggle-cure" onclick="toggleSection('cure')">CURING</div>
      </div>
      <div class="section-body collapsed" id="body-cure">
        <div class="shared-note" id="shared-cure"></div>
        <div class="field-grid cols-3">
          <div class="field-item">
            <label>Curing method</label>
            <select id="f-cure-method" data-table="CURING_CONDITION" data-field="curing_method">
              <option value="">— choose —</option>
            </select>
          </div>
          <div class="field-item">
            <label>Curing duration (days)</label>
            <input type="number" step="any" min="0" id="f-cure-days" data-table="CURING_CONDITION" data-field="curing_duration_days">
          </div>
          <div class="field-item">
            <label>Temperature (°C)</label>
            <input type="number" step="any" id="f-cure-temp" data-table="CURING_CONDITION" data-field="temperature_c">
          </div>
          <div class="field-item">
            <label>Humidity (%)</label>
            <input type="number" step="any" min="0" max="100" id="f-cure-humidity" data-table="CURING_CONDITION" data-field="humidity_pct">
          </div>
          <div class="field-item">
            <label>Standard</label>
            <input type="text" id="f-cure-std" data-table="CURING_CONDITION" data-field="standard_name">
          </div>
          <div class="field-item" style="display:flex;gap:16px;align-items:flex-end;padding-bottom:4px;">
            <label style="display:flex;gap:6px;align-items:center;font-size:12px;color:var(--text-muted);cursor:pointer;">
              <input type="checkbox" id="f-cure-wind" data-table="CURING_CONDITION" data-field="wind_protection" data-bool="true">
              Wind protection
            </label>
            <label style="display:flex;gap:6px;align-items:center;font-size:12px;color:var(--text-muted);cursor:pointer;">
              <input type="checkbox" id="f-cure-solar" data-table="CURING_CONDITION" data-field="solar_protection" data-bool="true">
              Solar protection
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- SECTION: SOURCE -->
    <div class="card" id="card-source">
      <div class="card-header">
        <div class="card-title section-toggle collapsed" id="toggle-source" onclick="toggleSection('source')">SOURCE</div>
      </div>
      <div class="section-body collapsed" id="body-source">
        <div id="no-source-msg" style="display:none;font-size:12px;color:var(--text-dim);font-style:italic;padding:4px 0;">
          No measurement linked to this material — cannot load source.
        </div>
        <div id="source-fields">
          <div class="field-grid">
            <div class="field-item">
              <label>Designation</label>
              <input type="text" id="f-src-desig" data-table="SOURCE" data-field="designation">
            </div>
            <div class="field-item">
              <label>Authors</label>
              <input type="text" id="f-src-authors" data-table="SOURCE" data-field="authors">
            </div>
            <div class="field-item">
              <label>Title</label>
              <input type="text" id="f-src-title" data-table="SOURCE" data-field="title">
            </div>
            <div class="field-item">
              <label>Year</label>
              <input type="number" id="f-src-year" data-table="SOURCE" data-field="year">
            </div>
            <div class="field-item">
              <label>DOI</label>
              <input type="text" id="f-src-doi" data-table="SOURCE" data-field="doi">
            </div>
            <div class="field-item">
              <label>URL</label>
              <input type="text" id="f-src-url" data-table="SOURCE" data-field="url">
            </div>
            <div class="field-item">
              <label>Journal</label>
              <input type="text" id="f-src-journal" data-table="SOURCE" data-field="journal">
            </div>
          </div>
          <div class="field-item" style="margin-top:4px;">
            <label>Notes</label>
            <textarea id="f-src-notes" data-table="SOURCE" data-field="notes"></textarea>
          </div>
        </div>
      </div>
    </div>


    <!-- LOG -->
    <div class="card" id="card-log">
      <div class="card-header">
        <div class="card-title section-toggle collapsed" id="toggle-log" onclick="toggleSection('log')">LOG</div>
      </div>
      <div class="section-body collapsed" id="body-log">
        <pre id="log" class="log"></pre>
      </div>
    </div>

  </div><!-- /editor-content -->

  <!-- SAVE BAR (sticky) -->
  <div class="save-bar" id="save-bar" style="display:none;">
    <span class="nb-changes" id="nb-changes-text"></span>
    <button class="btn btn-secondary" onclick="resetChanges()">Cancel</button>
    <button class="btn btn-primary" onclick="saveAll()">💾 Save</button>
  </div>

<script>
// =========================================================================
// Global state
// =========================================================================
let currentRecord   = null;   // current MATERIAL record
let currentMixId    = null;
let currentCureId   = null;
let currentSourceId = null;   // source of the first measurement

// pendingChanges : Map<tableName, Map<rowId, {field: newValue}>>
let pendingChanges = new Map();
// pendingBinders
let pendingBinders = { toAdd: [], toDelete: [] };
// pendingAggregates
let pendingAggregates = { toAdd: [], toDelete: [] };
// pendingScalars
let pendingScalars = { toAdd: [], toDelete: [] };
// Pending campaign code changes (LABEL)
let pendingLabels = { toAdd: [], toDelete: [] };

// =========================================================================
// Date helpers: Grist unix timestamp (seconds) ↔ input[type=date]
// =========================================================================
function tsToDateInput(ts) {
  if (ts == null || ts === 0) return '';
  try { return new Date(ts * 1000).toISOString().split('T')[0]; }
  catch { return ''; }
}

function dateInputToTs(str) {
  if (!str) return null;
  const t = new Date(str).getTime();
  return isNaN(t) ? null : t / 1000;
}

// =========================================================================
// Toggle collapsible sections
// =========================================================================
function toggleSection(key) {
  const toggle = document.getElementById('toggle-' + key);
  const body   = document.getElementById('body-'   + key);
  if (!toggle || !body) return;
  toggle.classList.toggle('collapsed');
  body.classList.toggle('collapsed');
}

// =========================================================================
// Change tracking
// =========================================================================
function markChanged(tableName, rowId, fieldId, value) {
  if (!pendingChanges.has(tableName)) pendingChanges.set(tableName, new Map());
  const tableMap = pendingChanges.get(tableName);
  if (!tableMap.has(rowId)) tableMap.set(rowId, {});
  tableMap.get(rowId)[fieldId] = value;
  updateSaveBar();
}

function countChanges() {
  let n = pendingBinders.toAdd.length    + pendingBinders.toDelete.length
        + pendingAggregates.toAdd.length + pendingAggregates.toDelete.length
        + pendingScalars.toAdd.length    + pendingScalars.toDelete.length
        + pendingLabels.toAdd.length     + pendingLabels.toDelete.length;
  for (const [, rowMap] of pendingChanges) n += rowMap.size;
  return n;
}

function updateSaveBar() {
  const n = countChanges();
  const bar = document.getElementById('save-bar');
  const txt = document.getElementById('nb-changes-text');
  if (n > 0) {
    bar.style.display = 'flex';
    txt.textContent = n + ' pending change' + (n > 1 ? 's' : '');
  } else {
    bar.style.display = 'none';
  }
}

// =========================================================================
// Attach change listeners to all fields in a container
// =========================================================================
function attachListeners(container, tableName, rowId) {
  if (!rowId) return;
  container.querySelectorAll('[data-table][data-field]').forEach(el => {
    if (el.dataset.table !== tableName) return;
    const field   = el.dataset.field;
    const isDate  = el.dataset.date === 'true';
    const isBool  = el.dataset.bool === 'true';
    const evtName = isBool ? 'change' : 'input';
    el.addEventListener(evtName, () => {
      el.classList.add('changed');
      let val;
      if (isBool) {
        val = el.checked ? true : false;
      } else if (isDate) {
        val = dateInputToTs(el.value);
      } else if (el.dataset.ref === 'true') {
        val = parseInt(el.value) || 0;
      } else if (el.type === 'number') {
        val = el.value === '' ? null : parseFloat(el.value);
      } else {
        val = el.value;
      }
      markChanged(tableName, rowId, field, val);
    });
  });
}

// =========================================================================
// Populate a field
// =========================================================================
function setField(id, val, isDate = false, isBool = false) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.remove('changed');
  if (isBool) {
    el.checked = !!val;
  } else if (isDate) {
    el.value = tsToDateInput(val);
  } else {
    // A value added by hand to a Choice column in Grist may be missing from the <select>.
    if (el.tagName === 'SELECT' && val != null && val !== '' && ![...el.options].some(o => o.value == val)) {
      el.add(new Option(GristHelpers.enumLabel(val), val));
    }
    el.value = (val != null) ? val : '';
  }
}

// =========================================================================
// MAIN LOADING
// =========================================================================
async function loadMaterial(record) {
  if (!record || !record.id) {
    document.getElementById('empty-state').style.display = '';
    document.getElementById('editor-content').style.display = 'none';
    document.getElementById('save-bar').style.display = 'none';
    return;
  }

  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('editor-content').style.display = '';
  selectedMeasId = null;
  pendingChanges    = new Map();
  pendingBinders    = { toAdd: [], toDelete: [] };
  pendingAggregates = { toAdd: [], toDelete: [] };
  pendingScalars    = { toAdd: [], toDelete: [] };
  pendingLabels     = { toAdd: [], toDelete: [] };
  updateSaveBar();

  currentRecord = record;
  GristHelpers.setStatus('Loading…', '');
  GristHelpers.log('Loading material id=' + record.id);

  try {
    // IDs of linked tables
    currentMixId    = record.fields?.id_mix_design       || record.id_mix_design || null;
    currentCureId   = record.fields?.id_curing_condition || record.id_curing_condition || null;

    // Normalize: grist.onRecord can deliver fields flat or nested
    const f = record.fields || record;
    currentMatFields = f;

    // ---- MATERIAL ----
    setField('f-mat-name',    f.name);
    setField('f-mat-manuf',   f.manufacturing_date,  true);
    setField('f-mat-demold',  f.demolding_date,       true);
    attachListeners(document.getElementById('card-material'), 'MATERIAL', record.id);

    // ---- EXPOSURES and CAMPAIGN CODES ----
    [allPlacementsArr, allLabelsArr, allSitesArr, allExposuresArr, allSourcesArr] = await Promise.all(
      ['PLACEMENT', 'LABEL', 'SITE', 'EXPOSURE', 'SOURCE'].map(t => GristHelpers.fetchAllRecords(t)));
    renderPlacements(record.id);
    renderCodes(record.id);

    // ---- MIX DESIGN ----
    currentMixFields = await loadLinked('MIX_DESIGN', currentMixId, {
      'f-mix-name':      'name',
      'f-mix-type':      'material_type',
      'f-mix-wc':        'wc_ratio',
      'f-mix-wl':        'wl_ratio',
      'f-mix-water':     'water_content_kg',
      'f-mix-watertype': 'water_type',
      'f-mix-admix':     'admix_type',
      'f-mix-adjuvant':  'adjuvant_content',
      'f-mix-air':       'entrained_air',
    }, 'card-mix') || {};

    // ---- AGGREGATES ----
    await loadAggregates();

    // ---- BINDERS ----
    await loadBinders();

    // ---- CURING ----
    await loadLinked('CURING_CONDITION', currentCureId, {
      'f-cure-method':   'curing_method',
      'f-cure-days':     'curing_duration_days',
      'f-cure-temp':     'temperature_c',
      'f-cure-humidity': 'humidity_pct',
      'f-cure-std':      'standard_name',
    }, 'card-cure', [
      { id: 'f-cure-wind',  field: 'wind_protection',  bool: true },
      { id: 'f-cure-solar', field: 'solar_protection',  bool: true },
    ]);

    // ---- SOURCE (first measurement of the material) ----
    await loadSource();

    // ---- Records shared with other materials: say so before they are edited ----
    renderSharedNotes(record.id);

    GristHelpers.setStatus('Ready', 'ready');
    GristHelpers.log('Material loaded ✓', 'ok');
  } catch(err) {
    GristHelpers.setStatus('Error', 'error');
    GristHelpers.log('Loading error: ' + err.message, 'err');
    console.error(err);
  }
}

// =========================================================================
// EXPOSURES (PLACEMENT) — site, exposure condition and dates of each exposure
// Changing the site / condition of an exposure only affects that exposure;
// editing the site or condition details changes a record that may be shared.
// =========================================================================
function optionList(records, labelFn, current, emptyText) {
  return `<option value="">${emptyText}</option>` + records.map(r =>
    `<option value="${r.id}" ${r.id === current ? 'selected' : ''}>${escapeHtml(labelFn(r))}</option>`).join('');
}
const siteText = r => `#${r.id} — ${r.fields.country_region || '?'}`;
const expoText = r => `#${r.id} — ${[GristHelpers.enumLabel(r.fields.exposure_type), GristHelpers.enumLabel(r.fields.exposure_nature)].filter(Boolean).join(' / ') || '?'}`;

function sharedText(n, what) {
  return n > 1 ? `⚠ Shared by ${n} ${what}: changes apply to all of them.` : '';
}

    return;
  }
  box.innerHTML = pls.map(p => {
    const f = p.fields;
    const site = allSitesArr.find(x => x.id === f.id_site);
    const expo = allExposuresArr.find(x => x.id === f.id_exposure);
    const nSite = allPlacementsArr.filter(x => x.fields.id_site === f.id_site).length;
    const nExpo = allPlacementsArr.filter(x => x.fields.id_exposure === f.id_exposure).length;
    const nMeas = allMeasurements.filter(m => m.fields.id_placement === p.id).length;
    return `
      <div class="placement-block" id="pl-${p.id}">
        <div class="pl-head">Exposure #${p.id} — ${escapeHtml(f.name || '')} <span style="font-weight:400;color:var(--text-dim);">(${nMeas} measurement${nMeas > 1 ? 's' : ''})</span></div>
        <div class="field-grid" data-scope="placement">
          <div class="field-item"><label>Site</label>
            <select data-table="PLACEMENT" data-field="id_site" data-ref="true">${optionList(allSitesArr, siteText, f.id_site, '— not specified —')}</select></div>
          <div class="field-item"><label>Exposure condition</label>
            <select data-table="PLACEMENT" data-field="id_exposure" data-ref="true">${optionList(allExposuresArr, expoText, f.id_exposure, '— not specified —')}</select></div>
          <div class="field-item"><label>Start date</label>
            <input type="date" value="${tsToDateInput(f.exposure_start_date)}" data-table="PLACEMENT" data-field="exposure_start_date" data-date="true"></div>
          <div class="field-item"><label>End date</label>
            <input type="date" value="${tsToDateInput(f.exposure_end_date)}" data-table="PLACEMENT" data-field="exposure_end_date" data-date="true"></div>
        </div>
        ${site ? `<details data-scope="site"><summary>Site details — #${site.id}</summary>
          <div class="shared-note">${sharedText(nSite, 'exposures')}</div>
          <div class="field-grid cols-3">
            <div class="field-item"><label>Country / Region</label><input type="text" value="${escapeHtml(site.fields.country_region || '')}" data-table="SITE" data-field="country_region"></div>
            <div class="field-item"><label>Latitude</label><input type="number" step="any" value="${site.fields.latitude ?? ''}" data-table="SITE" data-field="latitude"></div>
            <div class="field-item"><label>Longitude</label><input type="number" step="any" value="${site.fields.longitude ?? ''}" data-table="SITE" data-field="longitude"></div>
          </div></details>` : ''}
        ${expo ? `<details data-scope="expo"><summary>Exposure condition details — #${expo.id}</summary>
          <div class="shared-note">${sharedText(nExpo, 'exposures')}</div>
          <div class="field-grid">
            <div class="field-item"><label>Exposure type</label><select data-table="EXPOSURE" data-field="exposure_type">${enumOptions('exposure_type', expo.fields.exposure_type)}</select></div>
            <div class="field-item"><label>Exposure nature</label><select data-table="EXPOSURE" data-field="exposure_nature">${enumOptions('exposure_nature', expo.fields.exposure_nature)}</select></div>
            <div class="field-item"><label>Wetting (%)</label><input type="number" step="any" min="0" max="100" value="${expo.fields.wetting_duration_pct ?? ''}" data-table="EXPOSURE" data-field="wetting_duration_pct"></div>
            <div class="field-item"><label>Drying (%)</label><input type="number" step="any" min="0" max="100" value="${expo.fields.drying_duration_pct ?? ''}" data-table="EXPOSURE" data-field="drying_duration_pct"></div>
          </div></details>` : ''}
      </div>`;
  }).join('');
  pls.forEach(p => {
    const block = document.getElementById('pl-' + p.id);
    attachListeners(block.querySelector('[data-scope="placement"]'), 'PLACEMENT', p.id);
    const siteBox = block.querySelector('[data-scope="site"]');
    if (siteBox) attachListeners(siteBox, 'SITE', p.fields.id_site);
    const expoBox = block.querySelector('[data-scope="expo"]');
    if (expoBox) attachListeners(expoBox, 'EXPOSURE', p.fields.id_exposure);
  });
}

// =========================================================================
function renderCodes(matId) {
  const box = document.getElementById('mat-codes');
  const codes = allLabelsArr.filter(l => l.fields.id_material === matId);
  const pls = allPlacementsArr.filter(p => p.fields.id_material === matId);
  const srcText = r => r.fields.designation || (r.fields.authors || '').split(',')[0] || `Source #${r.id}`;
  const plText = r => r.fields.name || `Exposure #${r.id}`;
  box.innerHTML = codes.length ? codes.map(l => `
    <div class="code-row" id="code-${l.id}">
      <input type="text" value="${escapeHtml(l.fields.label || '')}" data-table="LABEL" data-field="label" title="Code">
      <select data-table="LABEL" data-field="id_source" data-ref="true" title="Campaign / source">${optionList(allSourcesArr, srcText, l.fields.id_source, '— no campaign —')}</select>
      <select data-table="LABEL" data-field="id_placement" data-ref="true" title="Exposure designated by the code">${optionList(pls, plText, l.fields.id_placement, '— the material (any exposure) —')}</select>
      <button class="btn-del" onclick="deleteCodeRow(${l.id})" title="Remove">✕</button>
    </div>`).join('') : '<div class="no-binders" style="margin-bottom:6px;">No campaign code.</div>';
  codes.forEach(l => attachListeners(document.getElementById('code-' + l.id), 'LABEL', l.id));
}

function addCodeRow() {
  const input = document.getElementById('new-code-label');
  const label = input.value.trim();
  if (!label || !currentRecord) return;
  pendingLabels.toAdd.push({ label, id_material: currentRecord.id, id_source: currentSourceId || 0 });
  const box = document.getElementById('mat-codes');
  box.insertAdjacentHTML('beforeend', `<div class="code-row" style="opacity:0.6;font-style:italic;">${escapeHtml(label)} (new)</div>`);
  input.value = '';
  updateSaveBar();
}

function deleteCodeRow(labelId) {
  if (!pendingLabels.toDelete.includes(labelId)) pendingLabels.toDelete.push(labelId);
  const row = document.getElementById('code-' + labelId);
  if (row) { row.style.opacity = '0.4'; row.style.textDecoration = 'line-through'; }
  updateSaveBar();
}

// Mix design, binders and curing may be shared by several materials
function renderSharedNotes(matId) {
  const nMix  = currentMixId  ? allMaterialsArr.filter(m => m.fields.id_mix_design === currentMixId).length : 0;
  const nCure = currentCureId ? allMaterialsArr.filter(m => m.fields.id_curing_condition === currentCureId).length : 0;
  document.getElementById('shared-mix').textContent     = sharedText(nMix, 'materials');
  document.getElementById('shared-binders').textContent = sharedText(nMix, 'materials (same mix design)');
  document.getElementById('shared-cure').textContent    = sharedText(nCure, 'materials');
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

// =========================================================================
// Load a linked table by FK and populate fields
// =========================================================================
async function loadLinked(tableName, rowId, fieldMap, cardId, extraBools = []) {
  if (!rowId) return null;
  try {
    const tableData = await grist.docApi.fetchTable(tableName);
    const idx = tableData.id.indexOf(rowId);
    if (idx < 0) return null;
    const fields = {};
    Object.keys(tableData).forEach(k => {
      if (k !== 'id' && k !== 'manualSort' && !k.startsWith('gristHelper_'))
        fields[k] = tableData[k][idx];
    });

    for (const [elId, fieldName] of Object.entries(fieldMap)) {
      setField(elId, fields[fieldName]);
    }
    for (const { id, field, bool } of extraBools) {
      setField(id, fields[field], false, bool);
    }
    attachListeners(document.getElementById(cardId), tableName, rowId);
    return fields;
  } catch(err) {
    GristHelpers.log('Error loading ' + tableName + ': ' + err.message, 'err');
    return null;
  }
}

// =========================================================================
// Binders: MIX_DESIGN_BINDER + BINDER
// =========================================================================
async function loadBinders() {
  const listEl = document.getElementById('binders-list');
  listEl.innerHTML = '';

  if (!currentMixId) {
    listEl.innerHTML = '<div class="no-binders">No mix design linked.</div>';
    return;
  }

  try {
    [allMixBinders, allBinders] = await Promise.all([
      GristHelpers.fetchAllRecords('MIX_DESIGN_BINDER'),
      GristHelpers.fetchAllRecords('BINDER'),
    ]);

    const binderMap = new Map(allBinders.map(b => [b.id, b.fields]));

    // Populate the creation select
    const sel = document.getElementById('new-binder-select');
    sel.innerHTML = '<option value="">— choose a binder —</option>';
    allBinders.forEach(b => {
      const opt = document.createElement('option');
      opt.value = b.id;
      opt.textContent = (b.fields.name || 'Binder #' + b.id) + ' (' + GristHelpers.enumLabel(b.fields.binder_type) + ')';
      sel.appendChild(opt);
    });

    const rows = allMixBinders.filter(mb => mb.fields.id_mix_design === currentMixId);

    if (rows.length === 0) {
      listEl.innerHTML = '<div class="no-binders">No binder in this mix design.</div>';
      return;
    }

    rows.forEach(mb => {
      const binder = binderMap.get(mb.fields.id_binder) || {};
      const row = document.createElement('div');
      row.className = 'binder-row';
      row.dataset.mbId = mb.id;
      row.innerHTML = `
        <span class="b-name">${binder.name || '(no name)'}</span>
        <span class="b-type">${GristHelpers.enumLabel(binder.binder_type) || '—'}</span>
        <input type="number" step="any" min="0" value="${mb.fields.content_kg_m3 != null ? mb.fields.content_kg_m3 : ''}" placeholder="kg/m³" data-mb-id="${mb.id}">
        <button class="btn-del" data-mb-id="${mb.id}" title="Remove">✕</button>
      `;
      listEl.appendChild(row);

      // Dosage listener
      const inp = row.querySelector('input[type=number]');
      inp.addEventListener('input', () => {
        const val = inp.value === '' ? null : parseFloat(inp.value);
        if (pendingBinders.toDelete.includes(mb.id)) return;
        markChanged('MIX_DESIGN_BINDER', mb.id, 'content_kg_m3', val);
      });

      // Delete listener
      const delBtn = row.querySelector('.btn-del');
      delBtn.addEventListener('click', () => {
        if (!pendingBinders.toDelete.includes(mb.id)) {
          pendingBinders.toDelete.push(mb.id);
        }
        row.style.opacity = '0.4';
        row.style.textDecoration = 'line-through';
        delBtn.disabled = true;
        updateSaveBar();
      });
    });
  } catch(err) {
    GristHelpers.log('Error loading binders: ' + err.message, 'err');
  }
}

function showAddBinderRow() {
  const el = document.getElementById('add-binder-row');
  el.style.display = el.style.display === 'none' ? 'grid' : 'none';
}

function confirmAddBinder() {
  const sel  = document.getElementById('new-binder-select');
  const inp  = document.getElementById('new-binder-kg');
  const binderId = parseInt(sel.value);
  const kg   = inp.value === '' ? null : parseFloat(inp.value);

  if (!binderId) { alert('Please choose a binder.'); return; }
  if (!currentMixId) { alert('No mix design linked to this material.'); return; }

  pendingBinders.toAdd.push({
    id_mix_design: currentMixId,
    id_binder:     binderId,
    content_kg_m3: kg,
  });

  // Temporary visual display
  const binder = allBinders.find(b => b.id === binderId);
  const listEl = document.getElementById('binders-list');
  const tempRow = document.createElement('div');
  tempRow.className = 'binder-row';
  tempRow.style.opacity = '0.6';
  tempRow.style.fontStyle = 'italic';
  tempRow.innerHTML = `
    <span class="b-name">${binder?.fields?.name || '(new)'} <span style="color:var(--accent);font-size:10px;">●</span></span>
    <span class="b-type">${GristHelpers.enumLabel(binder?.fields?.binder_type)}</span>
    <span>${kg != null ? kg + ' kg/m³' : '—'}</span>
    <span></span>
  `;
  listEl.appendChild(tempRow);

  sel.value  = '';
  inp.value  = '';
  document.getElementById('add-binder-row').style.display = 'none';
  updateSaveBar();
}

// =========================================================================
// Aggregates: MIX_DESIGN_AGGREGATE + AGGREGATE
// =========================================================================
async function loadAggregates() {
  const listEl = document.getElementById('aggregates-list');
  listEl.innerHTML = '';

  if (!currentMixId) {
    listEl.innerHTML = '<div class="no-binders">No mix design linked.</div>';
    return;
  }

  try {
    [allMixAggregates, allAggregates] = await Promise.all([
      GristHelpers.fetchAllRecords('MIX_DESIGN_AGGREGATE'),
      GristHelpers.fetchAllRecords('AGGREGATE'),
    ]);

    const aggregateMap = new Map(allAggregates.map(a => [a.id, a.fields]));

    // Populate the creation select
    const sel = document.getElementById('new-aggregate-select');
    sel.innerHTML = '<option value="">— choose an aggregate —</option>';
    allAggregates.forEach(a => {
      const opt = document.createElement('option');
      opt.value = a.id;
      const size = (a.fields.size_min_mm != null && a.fields.size_max_mm != null)
        ? ` ${a.fields.size_min_mm}/${a.fields.size_max_mm} mm` : '';
      opt.textContent = (a.fields.name || 'Aggregate #' + a.id) + size + ' (' + GristHelpers.enumLabel(a.fields.aggregate_type) + ')';
      sel.appendChild(opt);
    });

    const rows = allMixAggregates.filter(ma => ma.fields.id_mix_design === currentMixId);

    if (rows.length === 0) {
      listEl.innerHTML = '<div class="no-binders">No aggregate in this mix design.</div>';
      return;
    }

    rows.forEach(ma => {
      const agg = aggregateMap.get(ma.fields.id_aggregate) || {};
      const size = (agg.size_min_mm != null && agg.size_max_mm != null)
        ? `${agg.size_min_mm}/${agg.size_max_mm} mm` : '—';
      const row = document.createElement('div');
      row.className = 'binder-row';
      row.dataset.maId = ma.id;
      row.innerHTML = `
        <span class="b-name">${agg.name || '(no name)'}</span>
        <span class="b-type">${size}</span>
        <input type="number" step="any" min="0" value="${ma.fields.content_kg_m3 != null ? ma.fields.content_kg_m3 : ''}" placeholder="kg/m³" data-ma-id="${ma.id}">
        <button class="btn-del" data-ma-id="${ma.id}" title="Remove">✕</button>
      `;
      listEl.appendChild(row);

      const inp = row.querySelector('input[type=number]');
      inp.addEventListener('input', () => {
        const val = inp.value === '' ? null : parseFloat(inp.value);
        if (pendingAggregates.toDelete.includes(ma.id)) return;
        markChanged('MIX_DESIGN_AGGREGATE', ma.id, 'content_kg_m3', val);
      });

      const delBtn = row.querySelector('.btn-del');
      delBtn.addEventListener('click', () => {
        if (!pendingAggregates.toDelete.includes(ma.id))
          pendingAggregates.toDelete.push(ma.id);
        row.style.opacity = '0.4';
        row.style.textDecoration = 'line-through';
        delBtn.disabled = true;
        updateSaveBar();
      });
    });
  } catch(err) {
    GristHelpers.log('Error loading aggregates: ' + err.message, 'err');
  }
}

function showAddAggregateRow() {
  const el = document.getElementById('add-aggregate-row');
  el.style.display = el.style.display === 'none' ? 'grid' : 'none';
}

function confirmAddAggregate() {
  const sel        = document.getElementById('new-aggregate-select');
  const inp        = document.getElementById('new-aggregate-kg');
  const aggregateId = parseInt(sel.value);
  const kg         = inp.value === '' ? null : parseFloat(inp.value);

  if (!aggregateId) { alert('Please choose an aggregate.'); return; }
  if (!currentMixId) { alert('No mix design linked to this material.'); return; }

  pendingAggregates.toAdd.push({
    id_mix_design: currentMixId,
    id_aggregate:  aggregateId,
    content_kg_m3: kg,
  });

  const agg = allAggregates.find(a => a.id === aggregateId);
  const size = (agg?.fields?.size_min_mm != null && agg?.fields?.size_max_mm != null)
    ? `${agg.fields.size_min_mm}/${agg.fields.size_max_mm} mm` : '—';
  const listEl = document.getElementById('aggregates-list');
  const tempRow = document.createElement('div');
  tempRow.className = 'binder-row';
  tempRow.style.opacity = '0.6';
  tempRow.style.fontStyle = 'italic';
  tempRow.innerHTML = `
    <span class="b-name">${agg?.fields?.name || '(new)'} <span style="color:var(--accent);font-size:10px;">●</span></span>
    <span class="b-type">${size}</span>
    <span>${kg != null ? kg + ' kg/m³' : '—'}</span>
    <span></span>
  `;
  listEl.appendChild(tempRow);

  sel.value = '';
  inp.value = '';
  document.getElementById('add-aggregate-row').style.display = 'none';
  updateSaveBar();
}

// =========================================================================
// Measurements — Table + detail form
// =========================================================================
async function loadMeasurementsTable() {
  try {
    const [measurements, tests, scalars, curves, sources, materials, exposures, mixes, placements, sites] = await Promise.all([
      GristHelpers.fetchAllRecords('MEASUREMENT'),
      GristHelpers.fetchAllRecords('TEST'),
      GristHelpers.fetchAllRecords('SCALAR'),
      GristHelpers.fetchAllRecords('CURVE'),
      GristHelpers.fetchAllRecords('SOURCE'),
      GristHelpers.fetchAllRecords('MATERIAL'),
      GristHelpers.fetchAllRecords('EXPOSURE'),
      GristHelpers.fetchAllRecords('MIX_DESIGN'),
      GristHelpers.fetchAllRecords('PLACEMENT'),
      GristHelpers.fetchAllRecords('SITE'),
    ]);

    allMeasurements = measurements;
    measCtxMaps     = GristHelpers.contextMaps(materials, placements, sites, exposures);
    allPlacementsArr = placements;
    allTests        = new Map(tests.map(t => [t.id, t.fields]));
    allScalars      = scalars;
    allCurves       = curves;
    allSources      = new Map(sources.map(s => [s.id, s.fields]));
    allMaterialsArr = materials;
    allMaterialsMap = new Map(materials.map(m => [m.id, m.fields]));
    allExposuresMap = new Map(exposures.map(e => [e.id, e.fields]));
    allMixesMap     = new Map(mixes.map(m => [m.id, m.fields]));

    measLinked = measurements; // all measurements, no material filter
    GristHelpers.log(`${measurements.length} measurements loaded`, 'ok');

    // Index scalars and curves by measurement id
    measScalarsByMeas = new Map();
    scalars.forEach(s => {
      const mid = s.fields.id_measurement;
      if (!measScalarsByMeas.has(mid)) measScalarsByMeas.set(mid, []);
      measScalarsByMeas.get(mid).push(s);
    });
    measCurvesByMeas = new Map();
    curves.forEach(c => {
      const mid = c.fields.id_measurement;
      if (!measCurvesByMeas.has(mid)) measCurvesByMeas.set(mid, []);
      measCurvesByMeas.get(mid).push(c);
    });

    // Dynamic scalar column names (order of appearance)
    measScalarNames = [];
    const seenNames = new Set();
    measLinked.forEach(m => {
      (measScalarsByMeas.get(m.id) || []).forEach(s => {
        if (s.fields.name && !seenNames.has(s.fields.name)) {
          seenNames.add(s.fields.name);
          measScalarNames.push(s.fields.name);
        }
      });
    });

    buildMeasTableHeader();
    renderMeasTable();

    document.getElementById('meas-table-panel').style.display = measLinked.length > 0 ? '' : 'none';

  } catch(err) {
    GristHelpers.log('Error loading measurements: ' + err.message, 'err');
  }
}

// -------------------------------------------------------------------------
// Build the table header (fixed + dynamic columns)
// -------------------------------------------------------------------------
function buildMeasTableHeader() {
  const fixedCols = ['Test', 'Mode', 'Time (days)', 'Prep. date', 'Result date'];
  const allCols   = [...fixedCols, ...measScalarNames, 'Curves'];
  const tr = document.querySelector('#meas-thead tr');
  tr.innerHTML = allCols.map((name, i) =>
    `<th onclick="sortMeasTable(${i})" data-col="${i}">${name}<span class="sort-arrow"></span></th>`
  ).join('');
}

// -------------------------------------------------------------------------
// Render the table (filter + sort)
// -------------------------------------------------------------------------
function renderMeasTable() {
  const query = (document.getElementById('meas-search').value || '').toLowerCase();

  // Build row data
  let rows = measLinked.map(m => {
    const f        = m.fields;
    const test     = allTests.get(f.id_test) || {};
    const mScalars = measScalarsByMeas.get(m.id) || [];
    const mCurves  = measCurvesByMeas.get(m.id)  || [];
    const scMap    = new Map(mScalars.map(s => [s.fields.name, s.fields]));
    const scalarVals = measScalarNames.map(n => {
      const s = scMap.get(n);
      return (s && s.value != null) ? s.value : null;
    });
    const src = allSources.get(f.id_source);
    const srcLabel = src
      ? (src.designation || (src.authors ? src.authors.split(',')[0].trim() + (src.year ? ' ' + src.year : '') : '—'))
      : '—';
    const matF  = allMaterialsMap.get(f.id_material) || {};
    // Exposure of the measurement (its placement; none for laboratory tests)
    const expoF = GristHelpers.measurementContext(f, measCtxMaps).exposure || {};
    const mixF  = allMixesMap.get(matF.id_mix_design) || {};
    return {
      id:          m.id,
      mat_id:      f.id_material || 0,
      test:        test.name || '',
      testType:    test.test_type || '',
      mat_name:    matF.name            || '',
      source:      srcLabel,
      sample_type: f.sample_type || '',
      dimensions:  f.sample_dimensions || '',
      operator:    f.operator || '',
      prep:        tsToDateInput(f.preparation_date) || '',
      result:      tsToDateInput(f.result_date) || '',
      time_days:   (f.result_date && f.preparation_date) ? Math.round((f.result_date - f.preparation_date) / 86400) : null,
      mat_type:    mixF.material_type || matF.material_type || '',
      specimen:    f.specimen_id || '',
      expo_type:   expoF.exposure_type   || '',
      expo_nature: expoF.exposure_nature || '',
      wc_ratio:    mixF.wc_ratio         ?? null,
      wl_ratio:    mixF.wl_ratio         ?? null,
      water_kg:    mixF.water_content_kg ?? null,
      scalars:     scalarVals,
      scalarUnits: measScalarNames.map(n => { const s = scMap.get(n); return s ? (s.unit || '') : ''; }),
      nCurves:     mCurves.length,
    };
  });

  // Text filter
  if (query) {
    rows = rows.filter(r => {
      const L = GristHelpers.enumLabel;
      const all = [r.test, r.testType, r.mat_name, r.source, r.sample_type, r.dimensions, r.operator, r.prep, r.result,
                   r.mat_type, r.expo_type, r.expo_nature,
                   L(r.test), L(r.testType), L(r.sample_type), L(r.dimensions),
                   L(r.mat_type), L(r.expo_type), L(r.expo_nature),
                   r.wc_ratio != null ? String(r.wc_ratio) : '',
                   r.wl_ratio != null ? String(r.wl_ratio) : '',
                   ...r.scalars.map(v => v != null ? String(v) : ''),
                   String(r.nCurves)].join(' ').toLowerCase();
      return all.includes(query);
    });
  }

  // Stats
  document.getElementById('meas-tbl-stats').textContent =
    `${rows.length} measurement${rows.length > 1 ? 's' : ''} displayed out of ${measLinked.length}`;

  // Group by material id, order groups by material name
  const groups = new Map();
  rows.forEach(r => {
    if (!groups.has(r.mat_id)) groups.set(r.mat_id, []);
    groups.get(r.mat_id).push(r);
  });

  // Sort within each group by the selected column, or by prep date by default
  for (const [, grp] of groups) {
    if (measSortCol >= 0) {
      const sign = measSortAsc ? 1 : -1;
      grp.sort((a, b) => {
        const av = measRowVal(a, measSortCol);
        const bv = measRowVal(b, measSortCol);
        if (typeof av === 'number' && typeof bv === 'number') return sign * (av - bv);
        return sign * String(av ?? '').localeCompare(String(bv ?? ''), 'en');
      });
    } else {
      grp.sort((a, b) => String(a.prep ?? '').localeCompare(String(b.prep ?? ''), 'en'));
    }
  }

  const sortedGroups = [...groups.entries()].sort((a, b) =>
    String(a[1][0]?.mat_name ?? '').localeCompare(String(b[1][0]?.mat_name ?? ''), 'en')
  );

  // Render
  function fmtScal(val, unit) {
    if (val == null) return '<span class="meas-scal-empty">—</span>';
    let s;
    if (typeof val === 'number' && val !== 0 && (Math.abs(val) < 1e-3 || Math.abs(val) >= 1e6))
      s = val.toExponential(2);
    else
      s = parseFloat(Number(val).toPrecision(4)).toString();
    return unit ? `${s}<span class="meas-scal-unit">${unit}</span>` : s;
  }

  function clTag(ct) {
    const label = ct === 'free_cl' ? 'Free Cl' : ct === 'total_cl' ? 'Total Cl' : GristHelpers.enumLabel(ct);
    return ct ? `<span class="tag ${ct}">${label}</span>` : '<span style="color:var(--text-dim)">—</span>';
  }

  const nCols = 4 + measScalarNames.length + 1;
  let html = '';
  for (const [, grp] of sortedGroups) {
    const rep = grp[0];
    const matInfo = [
      GristHelpers.enumLabel(rep.mat_type),

      rep.wc_ratio != null ? `w/c ${Number(rep.wc_ratio).toFixed(2)}` : '',
      rep.wl_ratio != null ? `w/b ${Number(rep.wl_ratio).toFixed(2)}` : '',
      rep.water_kg != null ? `${Math.round(rep.water_kg)} kg/m³` : '',
      rep.source || '',
    ].filter(Boolean).join(' · ');

    html += `<tr class="meas-group-row">
      <td colspan="${nCols}">▸ ${rep.mat_name || '—'}${matInfo ? ' · ' + matInfo : ''}</td>
    </tr>`;

    grp.forEach(r => {
      const scCells = r.scalars.map((v, i) => `<td>${fmtScal(v, r.scalarUnits[i])}</td>`).join('');
      const sel = r.id === selectedMeasId ? ' class="meas-selected"' : '';
      html += `<tr${sel} data-meas-id="${r.id}">
        <td><span class="meas-badge">${GristHelpers.enumLabel(r.test) || '?'}</span>
          <span class="meas-sub">${escapeHtml([r.specimen, GristHelpers.enumLabel(r.expo_nature) || 'lab'].filter(Boolean).join(' · '))}</span></td>
        <td>${clTag(r.testType)}</td>
        <td>${r.time_days != null ? r.time_days : '—'}</td>
        <td>${r.prep || '—'}</td>
        <td>${r.result || '—'}</td>
        ${scCells}
        <td>${r.nCurves || '—'}</td>
      </tr>`;
    });
  }

  const tbody = document.getElementById('meas-tbl-body');
  tbody.innerHTML = html || '<tr><td colspan="20" style="text-align:center;padding:16px;color:var(--text-dim)">No measurement.</td></tr>';

  // Click listeners
  tbody.querySelectorAll('tr[data-meas-id]').forEach(tr => {
    tr.addEventListener('click', () => selectMeasRow(parseInt(tr.dataset.measId)));
  });
}

function measRowVal(r, col) {
  const fixed = [GristHelpers.enumLabel(r.test), GristHelpers.enumLabel(r.testType), r.time_days, r.prep, r.result];
  if (col < fixed.length) return fixed[col];
  const scIdx = col - fixed.length;
  if (scIdx < r.scalars.length) return r.scalars[scIdx] ?? -Infinity;
  return r.nCurves;
}

function sortMeasTable(colIdx) {
  document.querySelectorAll('#meas-data-table thead th').forEach((th, i) => {
    th.classList.remove('sorted-asc', 'sorted-desc');
  });
  if (measSortCol === colIdx) {
    measSortAsc = !measSortAsc;
  } else {
    measSortCol = colIdx;
    measSortAsc = true;
  }
  const th = document.querySelector(`#meas-data-table thead th[data-col="${colIdx}"]`);
  if (th) th.classList.add(measSortAsc ? 'sorted-asc' : 'sorted-desc');
  renderMeasTable();
}

// -------------------------------------------------------------------------
// Select a measurement → display detail form
// -------------------------------------------------------------------------
function selectMeasRow(measId) {
  selectedMeasId = measId;

  // Highlight
  document.querySelectorAll('#meas-tbl-body tr').forEach(tr => {
    tr.classList.toggle('meas-selected', parseInt(tr.dataset.measId) === measId);
  });

  const m       = measLinked.find(x => x.id === measId);
  if (!m) return;
  const mScalars = measScalarsByMeas.get(measId) || [];
  const mCurves  = measCurvesByMeas.get(measId)  || [];
  const test     = allTests.get(m.fields.id_test) || {};

  // Load the material edit form for this measurement
  const matRecord = allMaterialsArr.find(r => r.id === m.fields.id_material);
  if (matRecord) {
    currentRecord = matRecord;
    loadMaterial(matRecord);
  }

  // Detail panel title
  const prep   = tsToDateInput(m.fields.preparation_date) || '—';
  const result = tsToDateInput(m.fields.result_date) || '—';
  document.getElementById('meas-detail-subtitle').textContent =
    `${GristHelpers.enumLabel(test.name) || '?'} · ${prep} → ${result}`;

  // Form body
  const detailBody = document.getElementById('meas-detail-body');
  detailBody.innerHTML = buildDetailForm(m, mScalars, mCurves);
  document.getElementById('meas-detail-panel').style.display = '';

  // Attach listeners
  attachDetailListeners(detailBody, m, mScalars);

  // Scroll to form
  document.getElementById('meas-detail-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// -------------------------------------------------------------------------
// Build HTML for the measurement detail form
// -------------------------------------------------------------------------
function buildDetailForm(m, mScalars, mCurves) {
  const f = m.fields;

  // Keep a value added by hand in Grist that is not in ENUMS
  const withCurrent = (enumKey, v) => enumOptions(enumKey, v) +
    (v && !GristHelpers.ENUMS[enumKey].includes(v) ? `<option value="${v}" selected>${GristHelpers.enumLabel(v)}</option>` : '');
  const sampleTypeOpts = withCurrent('sample_type', f.sample_type);
  const dimOpts        = withCurrent('sample_dimensions', f.sample_dimensions);

  const scalarsHtml = mScalars.length > 0
    ? `<div class="scalar-cols-header"><span>Parameter</span><span>Value</span><span>Unit</span><span></span></div>`
      + mScalars.map(s => `
        <div class="scalar-row" data-scalar-id="${s.id}">
          <input type="text" value="${s.fields.name || ''}" placeholder="Parameter" list="dl-sc-name"
            data-table="SCALAR" data-field="name" data-scalar-id="${s.id}">
          <input type="number" step="any" value="${s.fields.value != null ? s.fields.value : ''}" placeholder="Value"
            data-table="SCALAR" data-field="value" data-scalar-id="${s.id}">
          <input type="text" value="${s.fields.unit || ''}" placeholder="Unit"
            data-table="SCALAR" data-field="unit" data-scalar-id="${s.id}">
          <button class="btn-del" data-scalar-del="${s.id}" title="Remove">✕</button>
        </div>
      `).join('')
    : '<div class="no-binders" style="margin-bottom:6px;">No scalar.</div>';

  const curvesHtml = mCurves.length > 0
    ? mCurves.map(c => `
        <div class="curve-row">
          <span class="meas-badge" style="font-size:9px;">#${c.id}</span>
          <span>${c.fields.x_name || 'X'} (${c.fields.x_unit || '?'}) → ${c.fields.y_name || 'Y'} (${c.fields.y_unit || '?'})</span>
        </div>
      `).join('')
    : '<div class="no-binders">No curve.</div>';

  const matPls = allPlacementsArr.filter(p => p.fields.id_material === f.id_material);
  const plOpts = `<option value="0">— none: laboratory test —</option>` + matPls.map(p =>
    `<option value="${p.id}" ${p.id === f.id_placement ? 'selected' : ''}>${escapeHtml(p.fields.name || 'Exposure #' + p.id)}</option>`).join('');
  return `
    <div class="sub-section-title">Measurement</div>
    <div class="field-grid cols-3">
      <div class="field-item">
        <label>Exposure</label>
        <select data-table="MEASUREMENT" data-field="id_placement" data-ref="true">${plOpts}</select>
      </div>
      <div class="field-item">
        <label>Specimen ID</label>
        <input type="text" value="${escapeHtml(f.specimen_id || '')}" data-table="MEASUREMENT" data-field="specimen_id">
      </div>
      <div class="field-item"><!-- spacer --></div>
      <div class="field-item">
        <label>Sample type</label>
        <select data-table="MEASUREMENT" data-field="sample_type">${sampleTypeOpts}</select>
      </div>
      <div class="field-item">
        <label>Dimensions</label>
        <select data-table="MEASUREMENT" data-field="sample_dimensions">${dimOpts}</select>
      </div>
      <div class="field-item">
        <label>Operator</label>
        <input type="text" value="${f.operator || ''}" data-table="MEASUREMENT" data-field="operator">
      </div>
      <div class="field-item">
        <label>Preparation date</label>
        <input type="date" value="${tsToDateInput(f.preparation_date)}"
          data-table="MEASUREMENT" data-field="preparation_date" data-date="true">
      </div>
      <div class="field-item">
        <label>Result date</label>
        <input type="date" value="${tsToDateInput(f.result_date)}"
          data-table="MEASUREMENT" data-field="result_date" data-date="true">
      </div>
      <div class="field-item">
        <label>Mass (g)</label>
        <input type="number" step="any" value="${f.sample_mass_g != null ? f.sample_mass_g : ''}"
          data-table="MEASUREMENT" data-field="sample_mass_g">
      </div>
    </div>

    <div class="sub-section-title" style="margin-top:14px;">Scalars</div>
    <div id="scalars-list-${m.id}">${scalarsHtml}</div>
    <button class="btn-add-inline" onclick="toggleAddScalarRow(${m.id})">+ Scalar</button>
    <div class="add-scalar-row" id="add-scalar-row-${m.id}" style="display:none;">
      <input type="text" id="new-scal-name-${m.id}" placeholder="Name (e.g.: D, Cs, Rc)">
      <input type="number" step="any" id="new-scal-val-${m.id}" placeholder="Value">
      <input type="text" id="new-scal-unit-${m.id}" placeholder="Unit">
      <button class="btn btn-primary" style="padding:4px 10px;font-size:11px;"
        onclick="confirmAddScalar(${m.id})">Add</button>
    </div>

    <div class="sub-section-title" style="margin-top:14px;">
      Curves <span style="font-weight:400;font-size:10px;color:var(--text-dim);">(read only)</span>
    </div>
    <div>${curvesHtml}</div>
  `;
}

// -------------------------------------------------------------------------
// Attach listeners to the detail form
// -------------------------------------------------------------------------
function attachDetailListeners(body, m, mScalars) {
  // MEASUREMENT fields
  body.querySelectorAll('[data-table="MEASUREMENT"]').forEach(el => {
    const field   = el.dataset.field;
    const isDate  = el.dataset.date === 'true';
    const evtName = (el.tagName === 'SELECT') ? 'change' : 'input';
    el.addEventListener(evtName, () => {
      el.classList.add('changed');
      let val;
      if (isDate) {
        val = dateInputToTs(el.value);
      } else if (el.dataset.ref === 'true') {
        val = parseInt(el.value) || 0;
      } else if (el.type === 'number') {
        val = el.value === '' ? null : parseFloat(el.value);
      } else {
        val = el.value;
      }
      markChanged('MEASUREMENT', m.id, field, val);
    });
  });

  // SCALAR fields
  body.querySelectorAll('[data-table="SCALAR"]').forEach(el => {
    const field    = el.dataset.field;
    const scalarId = parseInt(el.dataset.scalarId);
    el.addEventListener('input', () => {
      if (pendingScalars.toDelete.includes(scalarId)) return;
      el.classList.add('changed');
      const val = el.type === 'number'
        ? (el.value === '' ? null : parseFloat(el.value))
        : el.value;
      markChanged('SCALAR', scalarId, field, val);
    });
  });

  // SCALAR delete buttons
  body.querySelectorAll('[data-scalar-del]').forEach(btn => {
    const scalarId = parseInt(btn.dataset.scalarDel);
    btn.addEventListener('click', () => {
      if (!pendingScalars.toDelete.includes(scalarId))
        pendingScalars.toDelete.push(scalarId);
      const row = btn.closest('.scalar-row');
      if (row) { row.style.opacity = '0.4'; row.style.textDecoration = 'line-through'; }
      btn.disabled = true;
      updateSaveBar();
    });
  });
}

function toggleAddScalarRow(measId) {
  const el = document.getElementById('add-scalar-row-' + measId);
  if (el) el.style.display = el.style.display === 'none' ? 'grid' : 'none';
}

function confirmAddScalar(measId) {
  const nameEl = document.getElementById('new-scal-name-' + measId);
  const valEl  = document.getElementById('new-scal-val-'  + measId);
  const unitEl = document.getElementById('new-scal-unit-' + measId);
  const name = nameEl.value.trim();
  const val  = valEl.value === '' ? null : parseFloat(valEl.value);
  const unit = unitEl.value.trim() || null;

  if (!name) { alert('Parameter name is required.'); return; }

  pendingScalars.toAdd.push({ id_measurement: measId, name, value: val, unit, is_derived: false });

  const listEl = document.getElementById('scalars-list-' + measId);
  if (listEl) {
    const tempRow = document.createElement('div');
    tempRow.className = 'scalar-row';
    tempRow.style.cssText = 'opacity:0.6;font-style:italic;';
    tempRow.innerHTML = `
      <span>${name} <span style="color:var(--accent);font-size:10px;">●</span></span>
      <span>${val != null ? val : '—'}</span>
      <span>${unit || '—'}</span>
      <span></span>
    `;
    listEl.appendChild(tempRow);
  }
  nameEl.value = ''; valEl.value = ''; unitEl.value = '';
  document.getElementById('add-scalar-row-' + measId).style.display = 'none';
  updateSaveBar();
  renderMeasTable(); // refresh stats in the table row
}

// =========================================================================
// Source (first measurement)
// =========================================================================
async function loadSource() {
  const noSrcMsg   = document.getElementById('no-source-msg');
  const srcFields  = document.getElementById('source-fields');
  currentSourceId  = null;

  const linked = allMeasurements.filter(m => m.fields.id_material === currentRecord.id);

  if (linked.length === 0) {
    noSrcMsg.style.display = '';
    srcFields.style.display = 'none';
    return;
  }

  noSrcMsg.style.display = 'none';
  srcFields.style.display = '';

  const firstMeas = linked[0];
  const srcId = firstMeas.fields.id_source;
  if (!srcId) {
    noSrcMsg.style.display = '';
    srcFields.style.display = 'none';
    return;
  }

  currentSourceId = srcId;

  try {
    const tableData = await grist.docApi.fetchTable('SOURCE');
    const idx = tableData.id.indexOf(srcId);
    if (idx < 0) return;

    const fields = {};
    Object.keys(tableData).forEach(k => {
      if (k !== 'id' && k !== 'manualSort' && !k.startsWith('gristHelper_'))
        fields[k] = tableData[k][idx];
    });

    setField('f-src-desig',   fields.designation);
    setField('f-src-authors', fields.authors);
    setField('f-src-title',   fields.title);
    setField('f-src-year',    fields.year);
    setField('f-src-doi',     fields.doi);
    setField('f-src-url',     fields.url);
    setField('f-src-journal', fields.journal);
    setField('f-src-notes',   fields.notes);

    attachListeners(document.getElementById('card-source'), 'SOURCE', srcId);
  } catch(err) {
    GristHelpers.log('Error loading source: ' + err.message, 'err');
  }
}

// =========================================================================
// SAVE
// =========================================================================
async function saveAll() {
  const actions = [];

  // 1. UpdateRecord for each modified table/row
  for (const [tableName, rowMap] of pendingChanges) {
    for (const [rowId, fields] of rowMap) {
      actions.push(['UpdateRecord', tableName, parseInt(rowId), fields]);
    }
  }

  // 2. Delete binders
  for (const mbId of pendingBinders.toDelete) {
    actions.push(['RemoveRecord', 'MIX_DESIGN_BINDER', mbId]);
  }

  // 3. Add binders
  for (const fields of pendingBinders.toAdd) {
    actions.push(['AddRecord', 'MIX_DESIGN_BINDER', null, fields]);
  }

  // 4. Delete aggregates
  for (const maId of pendingAggregates.toDelete) {
    actions.push(['RemoveRecord', 'MIX_DESIGN_AGGREGATE', maId]);
  }

  // 5. Add aggregates
  for (const fields of pendingAggregates.toAdd) {
    actions.push(['AddRecord', 'MIX_DESIGN_AGGREGATE', null, fields]);
  }

  // 6. Delete scalars
  for (const sId of pendingScalars.toDelete) {
    actions.push(['RemoveRecord', 'SCALAR', sId]);
  }

  // 7. Add scalars
  for (const fields of pendingScalars.toAdd) {
    actions.push(['AddRecord', 'SCALAR', null, fields]);
  }

  // 8. Campaign codes
  for (const id of pendingLabels.toDelete) actions.push(['RemoveRecord', 'LABEL', id]);
  for (const fields of pendingLabels.toAdd) actions.push(['AddRecord', 'LABEL', null, fields]);

  // 9. Exposure names follow their site, condition and start date
  const pend = t => pendingChanges.get(t) || new Map();
  const merged = (arr, t, id) => ({ ...(arr.find(r => r.id === id)?.fields || {}), ...(pend(t).get(id) || {}) });
  allPlacementsArr.forEach(p => {
    const pf = merged(allPlacementsArr, 'PLACEMENT', p.id);
    if (!pend('PLACEMENT').has(p.id) && !pend('SITE').has(pf.id_site) && !pend('EXPOSURE').has(pf.id_exposure)) return;
    const name = GristHelpers.placementName(merged(allSitesArr, 'SITE', pf.id_site),
      merged(allExposuresArr, 'EXPOSURE', pf.id_exposure), pf.exposure_start_date);
    if (name !== p.fields.name) actions.push(['UpdateRecord', 'PLACEMENT', p.id, { name }]);
  });

  if (actions.length === 0) {
    GristHelpers.log('No changes to save.', 'warn');
    return;
  }

  GristHelpers.setStatus('Saving…', '');
  GristHelpers.log('Sending ' + actions.length + ' action(s)…');

  try {
    await grist.docApi.applyUserActions(actions);
    GristHelpers.log('Saved successfully ✓', 'ok');
    GristHelpers.setStatus('Saved', 'ready');
    const prevMeasId = selectedMeasId;
    pendingChanges    = new Map();
    pendingBinders    = { toAdd: [], toDelete: [] };
    pendingAggregates = { toAdd: [], toDelete: [] };
    pendingScalars    = { toAdd: [], toDelete: [] };
    pendingLabels     = { toAdd: [], toDelete: [] };
    updateSaveBar();
    await loadMaterial(currentRecord);
    // Re-select the measurement after reload
    if (prevMeasId) selectMeasRow(prevMeasId);
  } catch(err) {
    GristHelpers.setStatus('Error', 'error');
    GristHelpers.log('Save error: ' + err.message, 'err');
    console.error(err);
  }
}

function resetChanges() {
  pendingLabels     = { toAdd: [], toDelete: [] };
  pendingChanges    = new Map();
  pendingBinders    = { toAdd: [], toDelete: [] };
  pendingAggregates = { toAdd: [], toDelete: [] };
  pendingScalars    = { toAdd: [], toDelete: [] };
  updateSaveBar();
  loadMaterial(currentRecord);
}

// =========================================================================
// Suggested values for free-text inputs bound to Choice columns
function fillDatalist(id, values) {
  let dl = document.getElementById(id);
  if (!dl) { dl = document.createElement('datalist'); dl.id = id; document.body.appendChild(dl); }
  dl.innerHTML = values.map(v => `<option value="${v}">${GristHelpers.enumLabel(v)}</option>`).join('');
}

// Enum <select>: stored value as option value, display label as text
function enumOptions(enumKey, current, placeholder = '— choose —') {
  return ['', ...GristHelpers.ENUMS[enumKey]].map(v =>
    `<option value="${v}" ${current === v ? 'selected' : ''}>${v ? GristHelpers.enumLabel(v) : placeholder}</option>`
  ).join('');
}

function fillEnumSelect(elId, enumKey) {
  const el = document.getElementById(elId);
  if (el) el.innerHTML = enumOptions(enumKey, el.value);
}

// INIT
// =========================================================================
(async function() {
  GristHelpers.log('Initializing Editor…');
  fillDatalist('dl-admix', GristHelpers.ENUMS.admix_type);
  fillEnumSelect('f-mix-type',      'material_type');
  fillEnumSelect('f-mix-watertype', 'water_type');
  fillEnumSelect('f-cure-method',   'curing_method');
  fillDatalist('dl-sc-name', GristHelpers.ENUMS.scalar_name);
  grist.ready({ requiredAccess: 'full' });
  grist.onRecord(async (record) => {
    await loadMaterial(record);
  });
  await GristHelpers.ensureSchema();
  await loadMeasurementsTable();
})();
