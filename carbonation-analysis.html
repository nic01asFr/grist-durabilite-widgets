<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carbonation Analysis — Depth vs Time</title>

  <link rel="stylesheet" href="assets/shared-styles.css?v=4">
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script>
  <script src="assets/grist-helpers.js?v=4"></script>
  <script>
    // An older cached copy of grist-helpers.js would break this page: say so instead of failing silently
    if (typeof GristHelpers === 'undefined' || (GristHelpers.ASSETS_VERSION || 0) < 4) {
      document.addEventListener('DOMContentLoaded', () => document.body.insertAdjacentHTML('afterbegin',
        '<div style="padding:10px 14px;margin-bottom:12px;border:1px solid #dc2626;border-radius:8px;color:#dc2626;background:#fff;font-size:13px">' +
        'An outdated version of the shared scripts is cached by the browser. Reload the page (Ctrl+Shift+R / Cmd+Shift+R).</div>'));
    }
  </script>

  <style>
    #chart { width: 100%; min-height: 340px; border-radius: 8px; overflow: hidden; }
    .param-group input[type="number"] { width: 80px; }
    #direct-input-card .param-group input[type="number"] { width: 120px; }
  </style>
</head>
<body>

  <div class="header">
    <h1><span class="icon">🧱</span> Carbonation Analysis</h1>
    <div class="status" id="status">
      <span class="dot"></span>
      <span id="status-text">Loading Pyodide…</span>
    </div>
  </div>

  <div id="empty-state" class="empty-state">
    <div class="icon">🏗️</div>
    <h3>Waiting for data</h3>
    <p>Select a <strong>measurement</strong> (MEASUREMENT) with a carbonation test: the depth vs time series is built from all carbonation measurements of the same material.</p>
  </div>

  <div id="main-content" style="display:none">

    <div class="card">
      <div class="card-title">Context</div>
      <div class="info-grid" id="context-info"></div>
    </div>

    <div class="card">
      <div class="card-title">Input mode</div>
      <div class="mode-selector">
        <button class="mode-btn active" id="mode-profile" onclick="setMode('profile')">
          📈 Depth vs time
        </button>
        <button class="mode-btn" id="mode-direct" onclick="setMode('direct')">
          🔢 Direct K_carb input
        </button>
      </div>
    </div>

    <div class="card" id="chart-card">
      <div class="card-title" style="display:flex; justify-content:space-between; align-items:center;">
        <span>Carbonation front</span>
        <span id="nb-points" style="font-size:11px; color:var(--text-dim); text-transform:none; letter-spacing:0;"></span>
      </div>
      <div id="chart"></div>
    </div>

    <div class="card" id="fitting-controls-card">
      <div class="card-title">Parameters</div>
      <div class="param-row" style="margin-bottom:12px;">
        <div class="param-group">
          <label>Cover depth:</label>
          <input type="number" id="enrobage" value="30" step="5" min="10" max="120">
          <label>mm</label>
        </div>
      </div>
      <div class="controls">
        <button class="btn btn-primary" id="btn-fit" disabled onclick="runFitting()">
          ⚙️ Run fitting
        </button>
        <button class="btn btn-secondary" id="btn-save" disabled onclick="saveResults()">
          💾 Save
        </button>
      </div>
    </div>

    <div class="card" id="direct-input-card" style="display:none">
      <div class="card-title">Direct input</div>
      <div class="param-row" style="margin-bottom:12px;">
        <div class="param-group">
          <label>K_carb:</label>
          <input type="number" id="direct-kcarb" step="0.01" value="0.5">
          <label>mm/√day</label>
        </div>
        <div class="param-group">
          <label>Cover depth:</label>
          <input type="number" id="direct-enrobage" value="30" step="5" min="10" max="120">
          <label>mm</label>
        </div>
      </div>
      <div class="controls">
        <button class="btn btn-primary" id="btn-calc-direct" onclick="calcDirect()">
          ⚙️ Calculate service life
        </button>
        <button class="btn btn-secondary" id="btn-save-direct" disabled onclick="saveResults()">
          💾 Save
        </button>
      </div>
    </div>

    <div class="card" id="results-card" style="display:none">
      <div class="card-title">Results</div>
      <div class="info-grid" id="results-info"></div>
    </div>

    <div class="card">
      <div class="card-title">Log</div>
      <div class="log" id="log"></div>
    </div>
  </div>

  <script>
    // =========================================================================
    // STATE
    // =========================================================================
    let pyodide = null;
    let pyodideReady = false;
    let currentMeasurement   = null;
    let currentMaterial      = null;
    let currentMix           = null;
    let currentExposure      = null;
    let currentProfilePoints = null; // [{x: time_days, y: depth_mm, id: measurement id}]
    let lastFitResult = null;
    let gristReady = false;
    let currentMode = 'profile';

    // =========================================================================
    // MODE SWITCHING
    // =========================================================================
    function setMode(mode) {
      currentMode = mode;
      document.getElementById('mode-profile').classList.toggle('active', mode === 'profile');
      document.getElementById('mode-direct').classList.toggle('active', mode === 'direct');
      document.getElementById('chart-card').style.display            = mode === 'profile' ? '' : 'none';
      document.getElementById('fitting-controls-card').style.display = mode === 'profile' ? '' : 'none';
      document.getElementById('direct-input-card').style.display     = mode === 'direct'  ? '' : 'none';
      lastFitResult = null;
      document.getElementById('results-card').style.display = 'none';
      GristHelpers.log(`Mode: ${mode === 'profile' ? 'Depth vs time' : 'Direct K_carb input'}`);
      updateUI();
    }

    // =========================================================================
    // PYODIDE INIT
    // =========================================================================
    async function initPyodide() {
      GristHelpers.log('Loading Pyodide (Python WASM)…');
      try {
        pyodide = await loadPyodide();
        GristHelpers.log('Pyodide loaded ✓', 'ok');
        GristHelpers.log('Loading numpy + scipy…');
        await pyodide.loadPackage(['numpy', 'scipy']);
        GristHelpers.log('numpy + scipy loaded ✓', 'ok');
        pyodideReady = true;
        updateUI();
        GristHelpers.log('Ready for fitting.', 'ok');
      } catch (err) {
        GristHelpers.log('Pyodide error: ' + err.message, 'err');
        GristHelpers.setStatus('Pyodide error', 'error');
      }
    }

    // =========================================================================
    // GRIST CONNECTION — Select By MEASUREMENT
    // =========================================================================
    function initGrist() {
      grist.ready({
        requiredAccess: 'full',
        columns: [
          { name: 'id_material',      title: 'Material' },
          { name: 'sample_type',      title: 'Sample type' },
          { name: 'id_source',        title: 'Source' },
          { name: 'preparation_date', title: 'Preparation date' },
        ]
      });

      grist.onRecord(async function(record) {
        GristHelpers.log(`Measurement selected: id=${record.id}`);
        currentMeasurement = record;
        lastFitResult = null;
        document.getElementById('results-card').style.display = 'none';

        await fetchContext(record);
        await fetchResults(record.id);
        showContext();
        updateUI();
      });

      gristReady = true;
      GristHelpers.log('Connected to Grist ✓', 'ok');
    }

    // =========================================================================
    // FETCH CONTEXT — MATERIAL + MIX_DESIGN + EXPOSURE
    // =========================================================================
    async function fetchContext(measurement) {
      currentMaterial = null;
      currentMix = null;
      currentExposure = null;
      if (!measurement.id_material) return;
      try {
        const [materials, mixes, exposures, placements, sites] = await Promise.all([
          GristHelpers.fetchAllRecords('MATERIAL'),
          GristHelpers.fetchAllRecords('MIX_DESIGN'),
          GristHelpers.fetchAllRecords('EXPOSURE'),
          GristHelpers.fetchAllRecords('PLACEMENT'),
          GristHelpers.fetchAllRecords('SITE'),
        ]);
        // Exposure of the measurement (its placement; legacy MATERIAL columns if not migrated)
        const ctx = GristHelpers.measurementContext(measurement,
          GristHelpers.contextMaps(materials, placements, sites, exposures));
        currentMaterial = ctx.material;
        if (currentMaterial) {
          const mix  = mixes.find(m => m.id === currentMaterial.id_mix_design);
          currentMix = mix ? mix.fields : null;
          currentExposure = ctx.exposure;
          GristHelpers.log(`Material: ${currentMaterial.name || 'id=' + measurement.id_material}`, 'ok');
        }
      } catch (err) {
        GristHelpers.log('Fetch context error: ' + err.message, 'err');
      }
    }

    // =========================================================================
    // FETCH SERIES — one point per carbonation MEASUREMENT of the same material
    // =========================================================================
    // One MEASUREMENT = one specimen tested at one age. The depth vs time series is
    // built from all measurements of the selected material that share its test
    // (same TEST.name and test_type, so natural and accelerated are never mixed):
    //   depth: SCALAR 'mean_depth', else mean of the per-section curves (x_name='section')
    //   time:  SCALAR 'exposure_duration' (years unless unit is days),
    //          else result_date − preparation_date,
    //          else "t=<n> days" in the section curve notes (data-entry form)
    const DAY_UNITS = /^(d|day|days|j|jour|jours)$/i;

    function measurementDepth(mId, scalars, curves, dataPoints) {
      const means = scalars.filter(s => s.fields.id_measurement === mId && s.fields.name === 'mean_depth' && s.fields.value != null);
      if (means.length > 0) return means.reduce((a, s) => a + s.fields.value, 0) / means.length;
      const sectionIds = new Set(curves.filter(c => c.fields.id_measurement === mId && c.fields.x_name === 'section').map(c => c.id));
      const ys = dataPoints.filter(p => sectionIds.has(p.fields.id_curve) && p.fields.y != null).map(p => p.fields.y);
      return ys.length > 0 ? ys.reduce((a, y) => a + y, 0) / ys.length : null;
    }

    function measurementTimeDays(m, scalars, curves) {
      const dur = scalars.find(s => s.fields.id_measurement === m.id && s.fields.name === 'exposure_duration' && s.fields.value != null);
      if (dur) return DAY_UNITS.test((dur.fields.unit || '').trim()) ? dur.fields.value : dur.fields.value * 365.25;
      const { preparation_date: prep, result_date: res } = m.fields;
      if (prep != null && res != null && res > prep) return (res - prep) / 86400;
      for (const c of curves.filter(c => c.fields.id_measurement === m.id && c.fields.x_name === 'section')) {
        const match = /t=([\d.]+) days/.exec(c.fields.notes || '');
        if (match) return parseFloat(match[1]);
      }
      return null;
    }

    async function fetchResults(measurementId) {
      currentProfilePoints = null;
      try {
        const [measurements, tests, scalars, curves, dataPoints] = await Promise.all([
          GristHelpers.fetchAllRecords('MEASUREMENT'),
          GristHelpers.fetchAllRecords('TEST'),
          GristHelpers.fetchAllRecords('SCALAR'),
          GristHelpers.fetchAllRecords('CURVE'),
          GristHelpers.fetchAllRecords('DATA_CURVE'),
        ]);

        const selected = measurements.find(m => m.id === measurementId);
        const testOf   = m => tests.find(t => t.id === m.fields.id_test)?.fields || {};
        const selTest  = selected ? testOf(selected) : {};
        if (!selected || !selected.fields.id_material || selTest.name !== 'carbonation') {
          GristHelpers.log('Select a MEASUREMENT of a material with a "carbonation" test', 'warn');
          Plotly.purge('chart');
          document.getElementById('nb-points').textContent = '';
          return;
        }

        // Same material AND same exposure: one material exposed in two conditions gives two series
        const series = measurements.filter(m =>
          m.fields.id_material === selected.fields.id_material &&
          (m.fields.id_placement || 0) === (selected.fields.id_placement || 0) &&
          testOf(m).name === 'carbonation' &&
          (testOf(m).test_type || '') === (selTest.test_type || '')
        );

        const points = [], skipped = [];
        for (const m of series) {
          const y = measurementDepth(m.id, scalars, curves, dataPoints);
          const x = measurementTimeDays(m, scalars, curves);
          if (x == null || y == null) { skipped.push(m.id); continue; }
          points.push({ x, y, id: m.id });
        }
        points.sort((a, b) => a.x - b.x);

        currentProfilePoints = points;
        GristHelpers.log(
          `${points.length} point(s) from ${series.length} carbonation measurement(s) of this material` +
          (selTest.test_type ? ` (${GristHelpers.enumLabel(selTest.test_type)})` : ''),
          points.length > 1 ? 'ok' : 'warn'
        );
        if (skipped.length > 0) {
          GristHelpers.log(`Ignored (no depth or no exposure time): measurement(s) #${skipped.join(', #')}`, 'warn');
        }

        if (points.length > 0) {
          plotProfile(points);
        } else {
          Plotly.purge('chart');
          document.getElementById('nb-points').textContent = '';
        }
      } catch (err) {
        GristHelpers.log('Fetch series error: ' + err.message, 'err');
      }
    }

    // =========================================================================
    // DISPLAY CONTEXT
    // =========================================================================
    function showContext() {
      document.getElementById('empty-state').style.display = 'none';
      document.getElementById('main-content').style.display = 'block';

      const mat  = currentMaterial  || {};
      const mix  = currentMix       || {};
      const expo = currentExposure  || {};
      const fields = [
        { label: 'Material',       value: mat.name          || '—' },
        { label: 'Material type',  value: GristHelpers.enumLabel(mix.material_type || mat.material_type) || '—' },
        { label: 'w/c',            value: mix.wc_ratio != null ? mix.wc_ratio.toFixed(2) : '—' },
        { label: 'Exposure type',  value: GristHelpers.enumLabel(expo.exposure_type)   || '—' },
        { label: 'Exposure nature',value: GristHelpers.enumLabel(expo.exposure_nature) || '—' },
        { label: 'Wetting (%)',    value: expo.wetting_duration_pct ?? '—' },
      ];
      document.getElementById('context-info').innerHTML = fields.map(f => `
        <div class="info-item">
          <div class="label">${f.label}</div>
          <div class="value">${f.value}</div>
        </div>
      `).join('');
    }

    // =========================================================================
    // PLOT — Depth vs time
    // =========================================================================
    function plotProfile(points, fitData = null) {
      const t = points.map(p => p.x);
      const d = points.map(p => p.y);

      document.getElementById('nb-points').textContent = `${points.length} points`;

      const selId = currentMeasurement?.id;
      const traces = [{
        x: t, y: d,
        mode: 'markers', type: 'scatter', name: 'Measurements',
        text: points.map(p => p.id != null ? `Measurement #${p.id}` : ''),
        hovertemplate: '%{text}<br>t = %{x:.0f} days<br>depth = %{y:.1f} mm<extra></extra>',
        marker: {
          color: points.map(p => p.id === selId ? '#f59e0b' : '#8b5cf6'),
          size: points.map(p => p.id === selId ? 12 : 9),
          line: { color: '#4c1d95', width: 1.5 }
        }
      }];

      if (fitData) {
        traces.push({
          x: fitData.t_fit, y: fitData.d_fit,
          mode: 'lines', type: 'scatter',
          name: `K_carb (R²=${fitData.R2.toFixed(4)})`,
          line: { color: '#f59e0b', width: 2.5 }
        });
        const enrobage = parseFloat(document.getElementById('enrobage').value);
        traces.push({
          x: [0, Math.max(...t) * 1.3], y: [enrobage, enrobage],
          mode: 'lines', type: 'scatter', name: `Cover depth = ${enrobage} mm`,
          line: { color: '#ef4444', width: 1.5, dash: 'dash' }
        });
      }

      Plotly.newPlot('chart', traces, GristHelpers.plotlyDarkLayout({
        xaxis: GristHelpers.plotlyDarkAxis('Time (days)'),
        yaxis: GristHelpers.plotlyDarkAxis('Carbonation depth (mm)')
      }), { responsive: true, displayModeBar: true, modeBarButtonsToRemove: ['lasso2d', 'select2d'], displaylogo: false });
    }

    // =========================================================================
    // FITTING — K_carb : depth = K_carb * sqrt(time)
    // =========================================================================
    async function runFitting() {
      if (!pyodideReady || !currentProfilePoints || currentProfilePoints.length < 2) {
        GristHelpers.log('Pyodide and at least 2 points required', 'warn');
        return;
      }

      const btn = document.getElementById('btn-fit');
      btn.disabled = true; btn.textContent = '⏳ Computing…';
      GristHelpers.log('Running carbonation fitting (K_carb)…');

      try {
        const t_days  = currentProfilePoints.map(p => p.x);
        const d_mm    = currentProfilePoints.map(p => p.y);
        const enrobage = parseFloat(document.getElementById('enrobage').value);

        pyodide.globals.set('t_days_js',      pyodide.toPy(t_days));
        pyodide.globals.set('d_mm_js',        pyodide.toPy(d_mm));
        pyodide.globals.set('enrobage_mm_js', enrobage);

        const resultJson = pyodide.runPython(`
import numpy as np
from scipy.optimize import curve_fit
import json

t = np.array(list(t_days_js), dtype=float)
d = np.array(list(d_mm_js), dtype=float)
enrobage_mm = float(enrobage_mm_js)

def carb_model(t, K):
    return K * np.sqrt(t)

try:
    popt, pcov = curve_fit(carb_model, t, d, p0=[1.0], bounds=([0], [100]))
    K_carb = popt[0]

    d_pred = carb_model(t, K_carb)
    SS_res = np.sum((d - d_pred)**2)
    SS_tot = np.sum((d - np.mean(d))**2)
    R2 = 1.0 - SS_res / SS_tot if SS_tot > 0 else 0.0
    RMSE = np.sqrt(np.mean((d - d_pred)**2))

    t_fit = np.linspace(0, max(t) * 1.3, 100)
    d_fit = carb_model(t_fit, K_carb)

    if K_carb > 0:
        t_vie_jours = (enrobage_mm / K_carb)**2
        duree_vie_ans = t_vie_jours / 365.25
    else:
        duree_vie_ans = -1

    result = {
        "success": True, "K_carb": float(K_carb),
        "R2": float(R2), "RMSE": float(RMSE),
        "duree_vie_ans": float(duree_vie_ans),
        "enrobage_mm": float(enrobage_mm),
        "t_fit": t_fit.tolist(), "d_fit": d_fit.tolist()
    }
except Exception as e:
    result = {"success": False, "error": str(e)}

json.dumps(result)
        `);

        const fit = JSON.parse(resultJson);
        if (!fit.success) {
          GristHelpers.log('Fitting failed: ' + fit.error, 'err');
          btn.disabled = false; btn.textContent = '⚙️ Run fitting';
          return;
        }

        lastFitResult = fit;
        lastFitResult.source = 'fitting';
        const kAn = fit.K_carb * Math.sqrt(365.25);
        GristHelpers.log(`Fitting: K_carb=${fit.K_carb.toFixed(4)} mm/√d (${kAn.toFixed(2)} mm/√yr), R²=${fit.R2.toFixed(4)}`, 'ok');
        GristHelpers.log(`Service life: ${fit.duree_vie_ans > 0 ? fit.duree_vie_ans.toFixed(1) + ' yr' : '∞'}`, 'ok');

        plotProfile(currentProfilePoints, fit);
        showResults(fit);
        document.getElementById('btn-save').disabled = false;
      } catch (err) {
        GristHelpers.log('Fitting error: ' + err.message, 'err');
      }

      btn.disabled = false; btn.textContent = '⚙️ Run fitting';
    }

    // =========================================================================
    // DIRECT CALCULATION
    // =========================================================================
    function calcDirect() {
      const kcarb   = parseFloat(document.getElementById('direct-kcarb').value);
      const enrobage = parseFloat(document.getElementById('direct-enrobage').value);

      if (isNaN(kcarb) || kcarb <= 0) { GristHelpers.log('Invalid K_carb', 'err'); return; }

      const t_vie_jours = (enrobage / kcarb) ** 2;
      const duree_vie_ans = t_vie_jours / 365.25;

      lastFitResult = {
        success: true, K_carb: kcarb, R2: null, RMSE: null,
        duree_vie_ans, enrobage_mm: enrobage, source: 'direct'
      };

      const kAn = kcarb * Math.sqrt(365.25);
      GristHelpers.log(`Direct calculation: K_carb=${kcarb.toFixed(4)} mm/√d (${kAn.toFixed(2)} mm/√yr)`, 'ok');
      GristHelpers.log(`Service life: ${duree_vie_ans.toFixed(1)} yr`, 'ok');

      showResults(lastFitResult);
      document.getElementById('btn-save-direct').disabled = false;
    }

    // =========================================================================
    // SHOW RESULTS
    // =========================================================================
    function showResults(fit) {
      document.getElementById('results-card').style.display = 'block';
      const kAn = fit.K_carb * Math.sqrt(365.25);
      const items = [
        { label: 'K_carb',        value: fit.K_carb.toFixed(4),                           unit: 'mm/√day' },
        { label: 'K_carb',        value: kAn.toFixed(2),                                  unit: 'mm/√yr'  },
        { label: 'R²',            value: fit.R2   != null ? fit.R2.toFixed(4)   : '—',    unit: ''        },
        { label: 'RMSE',          value: fit.RMSE != null ? fit.RMSE.toFixed(3) : '—',    unit: 'mm'      },
        { label: 'Service life',  value: fit.duree_vie_ans > 0 ? fit.duree_vie_ans.toFixed(1) : '∞', unit: 'yr' },
        { label: 'Cover depth',   value: fit.enrobage_mm.toFixed(0),                      unit: 'mm'      },
      ];
      document.getElementById('results-info').innerHTML = items.map(f => `
        <div class="info-item">
          <div class="label">${f.label}</div>
          <div class="value">${f.value} <span class="unit">${f.unit}</span></div>
        </div>
      `).join('');
    }

    // =========================================================================
    // SAVE TO SCALAR (carbonation)
    // =========================================================================
    async function saveResults() {
      if (!lastFitResult || !currentMeasurement) { GristHelpers.log('Nothing to save', 'warn'); return; }

      const btnP = document.getElementById('btn-save');
      const btnD = document.getElementById('btn-save-direct');
      if (btnP) btnP.disabled = true;
      if (btnD) btnD.disabled = true;
      GristHelpers.log('Saving to SCALAR…');

      try {
        // K_carb is fitted in mm/√day; stored in mm/√yr (RILEM "Carbonation rate coefficient")
        const params = [
          { name: 'carbonation_rate_coeff', value: lastFitResult.K_carb * Math.sqrt(365.25),          unit: 'mm/yr^0.5', is_derived: true  },
          { name: 'R2',                     value: lastFitResult.R2,                                   unit: '',          is_derived: true  },
          { name: 'RMSE',                   value: lastFitResult.RMSE,                                 unit: 'mm',        is_derived: true  },
          { name: 'duree_vie_ans',          value: lastFitResult.duree_vie_ans > 0 ? lastFitResult.duree_vie_ans : null, unit: 'yr', is_derived: true },
          { name: 'cover_depth',            value: lastFitResult.enrobage_mm,                          unit: 'mm',        is_derived: false },
          { name: 'source_kcarb',           value: lastFitResult.source === 'fitting' ? 1 : 0,         unit: '',          is_derived: false },
        ].filter(p => p.value != null);

        const records = params.map(p => ({
          id_measurement: currentMeasurement.id,
          name:           p.name,
          value:          p.value,
          unit:           p.unit,
          is_derived:     p.is_derived,
          notes:          `Carbonation fitting (x = K·√t) — ${new Date().toLocaleDateString('en-US')}` +
                          (lastFitResult.source === 'fitting' && currentProfilePoints
                            ? ` — measurements #${currentProfilePoints.map(p => p.id).join(', #')}` : ''),
        }));

        const results = await GristHelpers.bulkCreateRecords('SCALAR', records);
        GristHelpers.log(`${results.length} scalar(s) saved to SCALAR ✓`, 'ok');
      } catch (err) {
        GristHelpers.log('Save error: ' + err.message, 'err');
      }

      if (btnP) btnP.disabled = false;
      if (btnD) btnD.disabled = false;
    }

    // =========================================================================
    // UI STATE
    // =========================================================================
    function updateUI() {
      const btnFit = document.getElementById('btn-fit');
      btnFit.disabled = !(pyodideReady && currentProfilePoints && currentProfilePoints.length >= 2);
      if (pyodideReady && gristReady) GristHelpers.setStatus('Ready', 'ready');
      else if (pyodideReady) GristHelpers.setStatus('Pyodide OK — waiting for Grist…', '');
    }

    // =========================================================================
    // INIT
    // =========================================================================
    (async function() {
      GristHelpers.log('Initializing Carbonation Analysis…');
      initGrist();
      await GristHelpers.ensureSchema();
      await initPyodide();
    })();
  </script>
</body>
</html>
